name: Publish Blobi Web image

# Manual only, main only, and it writes only the sha- tag (reusing a tag overwrites it; reference images by digest). It never moves :main, which stays
# with the previous publisher until the maintainer approves the cutover (see the migration runbook).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/blobidev/blobi-web:sha-${{ github.sha }}
          build-args: |
            PUBLIC_WAITLIST_ENDPOINT=${{ vars.PUBLIC_WAITLIST_ENDPOINT }}
            PUBLIC_WAITLIST_LIST_EN=${{ vars.PUBLIC_WAITLIST_LIST_EN }}
            PUBLIC_WAITLIST_LIST_ES=${{ vars.PUBLIC_WAITLIST_LIST_ES }}
            PUBLIC_INVITES_API=${{ vars.PUBLIC_INVITES_API }}
          labels: |
            org.opencontainers.image.source=https://github.com/blobidev/blobi-web
          cache-from: type=gha
          cache-to: type=gha,mode=max
